name: Cleanup merged branches

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    name: Remove obsolete merged branches
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Delete obsolete branches
        shell: bash
        run: |
          set -euo pipefail
          git push origin --delete hotfix/provider-dependency-sides tm-cli-usability
