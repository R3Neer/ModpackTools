name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Windows x64 Native AOT and Nushell
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: hustcer/setup-nu@v3
        with:
          version: '0.116.2'
      - name: Restore locked dependencies and publish native executables
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $projects = @{
            contracts = 'Tests/CoreContracts/CoreContracts.csproj'
            cli = 'src/ModpackTools.Cli/ModpackTools.Cli.csproj'
            launcher = 'src/ModpackTools.Launcher/ModpackTools.Launcher.csproj'
            setup = 'src/ModpackTools.Setup/ModpackTools.Setup.csproj'
          }
          foreach ($entry in $projects.GetEnumerator()) {
            dotnet restore $entry.Value --locked-mode
            if ($LASTEXITCODE) { throw 'Locked restore failed' }
            dotnet publish $entry.Value -c Release --no-restore -o "artifacts/$($entry.Key)"
            if ($LASTEXITCODE) { throw 'Native AOT publication failed' }
          }
      - name: Validate native protocol and create the distribution
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./artifacts/contracts/CoreContracts.exe
          if ($LASTEXITCODE) { throw 'Native core contracts failed' }
          ./artifacts/contracts/CoreContracts.exe --verify-native-tools
          if ($LASTEXITCODE) { throw 'Native process ownership failed' }
          ./artifacts/contracts/CoreContracts.exe --verify-long-processes
          if ($LASTEXITCODE) { throw 'Long-path native process contracts failed' }
          ./Tests/compatibility/Test-NativeProtocol.ps1 -Executable ./artifacts/cli/modpacktools.exe
          ./Tests/compatibility/Test-NativeVersion.ps1 -Executable ./artifacts/cli/modpacktools.exe
          $version = (& ./artifacts/setup/modpacktools-setup.exe --version).Trim()
          if ($LASTEXITCODE) { throw 'Setup version failed' }
          $metadata = ./scripts/get-release-metadata.ps1
          if ($version -cne $metadata.Version) { throw 'Native and release metadata versions differ' }
          [void][IO.Directory]::CreateDirectory('artifacts/release')
          $archive = "artifacts/release/ModpackTools-Native-win-x64-$version.zip"
          $text = & ./artifacts/setup/modpacktools-setup.exe pack --core ./artifacts/cli/modpacktools.exe --launcher ./artifacts/launcher/modpack.exe --assets . --output $archive --json
          if ($LASTEXITCODE) { throw 'Native package build failed' }
          $package = $text | ConvertFrom-Json
          if ((Get-FileHash -LiteralPath $archive).Hash -cne $package.sha256) { throw 'Native package digest mismatch' }
          [IO.File]::WriteAllText((Join-Path $PWD 'artifacts/release/SHA256SUMS'), "$($package.sha256)  $([IO.Path]::GetFileName($archive))`n", [Text.UTF8Encoding]::new($false))
      - name: Verify native installation, update, retirement and Nu bootstrap
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $native = @{Setup='./artifacts/setup/modpacktools-setup.exe'; Launcher='./artifacts/launcher/modpack.exe'; NativeExecutable='./artifacts/cli/modpacktools.exe'; NuExecutable=(Get-Command nu).Source}
          ./Tests/compatibility/Test-NativeSetup.ps1 @native -Inspector ./artifacts/contracts/CoreContracts.exe
          ./Tests/compatibility/Test-NativeRetirement.ps1 @native -Inspector ./artifacts/contracts/CoreContracts.exe
          ./Tests/compatibility/Test-NativeSelfUpdate.ps1 @native
          ./Tests/compatibility/Test-NativeNuInstaller.ps1 @native
          $archive = Get-ChildItem -LiteralPath artifacts/release -Filter '*.zip' -File
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath artifacts/package
          nu --no-config-file Tests/compatibility/Test-NativeNuOnly.nu (Join-Path $PWD 'artifacts/package')
          if ($LASTEXITCODE) { throw 'Native-only Nu routing failed' }
          nu --no-config-file Tests/compatibility/Test-NativeNuLongPaths.nu (Join-Path $PWD 'artifacts/package')
          if ($LASTEXITCODE) { throw 'Long-path Nu bridge failed' }
      - name: Verify complete Nu command surface with pinned real Packwiz
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $env:RUNNER_TEMP 'packwiz-dfd8b68.zip'
          Invoke-WebRequest -Uri 'https://github.com/R3Neer/ModpackTools/releases/download/v1.0.0/ModpackTools-Packwiz-win-x64-dfd8b68.zip' -OutFile $zip
          if ((Get-FileHash -LiteralPath $zip).Hash -cne '899CA7D4DF273BD4F2B916FB7361E5B32B55F092393C2C90FA47B14C38509F31') { throw 'Packwiz archive digest mismatch' }
          $destination = Join-Path $env:RUNNER_TEMP 'packwiz-dfd8b68'
          Expand-Archive -LiteralPath $zip -DestinationPath $destination
          $packwiz = Join-Path $destination 'packwiz.exe'
          if ((Get-FileHash -LiteralPath $packwiz).Hash -cne '7182F0B513A4FF117CA252B7EAEA2CEDEEDE19DD9A0BED77A10403D75A3C9295') { throw 'Packwiz executable digest mismatch' }
          ./Tests/compatibility/Invoke-NativeNuChecks.ps1 -Executable ./artifacts/cli/modpacktools.exe -NuExecutable (Get-Command nu).Source -StubExecutable ./artifacts/contracts/CoreContracts.exe -PackwizExecutable $packwiz
      - name: Retain the exact tested native package
        uses: actions/upload-artifact@v4
        with:
          name: native-win-x64-${{ github.sha }}
          path: artifacts/release/*
          if-no-files-found: error
