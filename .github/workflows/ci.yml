name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: PowerShell 7 and Pester
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install the test dependency
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -RequiredVersion 4.10.1 -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Validate the module manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Test-ModuleManifest -Path ./ModpackTools.psd1 | Out-Null

      - name: Run the test suite
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module Pester -RequiredVersion 4.10.1 -Force
          $result = Invoke-Pester -Script ./Tests -PassThru
          if ($result.FailedCount -gt 0) {
              throw "$($result.FailedCount) test(s) failed."
          }

      - name: Verify repository installation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./Install-ModpackTools.ps1 -Force -NonInteractive -SkipDoctor
          Import-Module ModpackTools -Force
          $expected = [version](Import-PowerShellDataFile ./ModpackTools.psd1).ModuleVersion
          $installed = (Get-Module ModpackTools).Version
          if ($installed -ne $expected) {
              throw "Installed version $installed does not match manifest version $expected."
          }
          modpack --version

      - name: Verify isolated presentation installation and failed upgrade
        shell: pwsh
        run: ./Tests/Invoke-PresentationIntegration.ps1

      - name: Verify self-update and post-replacement rollback
        shell: pwsh
        run: ./Tests/Invoke-SelfUpdateIntegration.ps1

  nushell:
    name: Nushell adapter
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Nushell
        uses: hustcer/setup-nu@v3
        with:
          version: '0.115.1'

      - name: Parse the Nushell adapter and installer
        shell: nu {0}
        run: |
          let adapter = ($env.GITHUB_WORKSPACE | path join 'Nushell' 'modpack.nu')
          if not (nu-check --debug --as-module $adapter) {
              error make { msg: 'Nushell adapter failed nu-check.' }
          }
          let installer = ($env.GITHUB_WORKSPACE | path join 'install-modpack-tools.nu')
          if not (nu-check $installer) {
              error make { msg: 'Nushell installer failed nu-check.' }
          }

      - name: Validate the Nushell bridge contract
        shell: nu {0}
        run: |
          let contract = ($env.GITHUB_WORKSPACE | path join 'Tests' 'Nushell.Contract.nu')
          nu $contract

      - name: Verify Nushell installer configures Nushell
        shell: nu {0}
        run: |
          let installer = ($env.GITHUB_WORKSPACE | path join 'install-modpack-tools.nu')
          ^nu $installer --force --non-interactive --skip-doctor
          if $env.LAST_EXIT_CODE != 0 {
              error make { msg: 'The Nushell installer failed.' }
          }
          let config = ($env.APPDATA | path join 'nushell' 'config.nu')
          if not ($config | path exists) {
              error make { msg: 'The installer did not create the Nushell config file.' }
          }
          let text = (open --raw $config)
          if not ($text | str contains '# >>> ModpackTools Nushell >>>') {
              error make { msg: 'The installer did not add the ModpackTools Nushell block.' }
          }

      - name: Verify installed Nushell command in a fresh process
        shell: nu {0}
        run: |
          let config = ($env.APPDATA | path join 'nushell' 'config.nu')
          ^nu --config $config -c 'let value = (modpack --version --offline --no-human); if (($value.version? | default "") == "") { error make { msg: "Installed ModpackTools wrapper returned no version." } }'
          if $env.LAST_EXIT_CODE != 0 {
              error make { msg: 'The installed ModpackTools Nushell wrapper failed in a fresh process.' }
          }
